name: Publier la page

# Régénère index.html depuis biens.py et publie sur GitHub Pages,
# à chaque modification poussée sur main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Générer la page
        run: |
          mkdir -p site
          python3 generer-page-maisons.py site
          mv site/maisons-var-cote-azur.html site/index.html

      - name: Garde-fou — aucun JavaScript
        run: |
          if grep -q "<script" site/index.html; then
            echo "JavaScript détecté : Quick Look sur iPhone ne l'exécute pas, la page apparaîtrait vide."
            exit 1
          fi
          echo "OK, page sans JavaScript."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
